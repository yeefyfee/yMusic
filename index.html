<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0f">
    <title>Solara</title>
    <meta name="apple-mobile-web-app-title" content="Solara">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
    <link rel="shortcut icon" href="/favicon.png">
    <link rel="mask-icon" href="/favicon.svg" color="#5bbad5">
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.png">
    <link rel="apple-touch-icon-precomposed" sizes="180x180" href="/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css?v=14">
    <script src="js/i18n.js"></script>
    <script>
        (function () {
            const ua = navigator.userAgent || "";
            const isMobileUA = /android|iphone|ipad|ipod|mobile|blackberry|phone|opera mini|windows phone/i.test(ua);
            const isSmallScreen = typeof window.matchMedia === "function" && window.matchMedia("(max-width: 820px)").matches;
            const urlParams = new URLSearchParams(window.location.search);
            const forceDesktop = urlParams.get("desktop") === "true";
            const isMobile = !forceDesktop && (isMobileUA || isSmallScreen);
            window.__SOLARA_IS_MOBILE = isMobile;
            if (!isMobile) {
                document.documentElement.classList.add("desktop-view");
                const desktopLink = document.createElement("link");
                desktopLink.rel = "stylesheet";
                desktopLink.href = "css/desktop.css?v=2";
                desktopLink.id = "desktopStylesheet";
                document.head.appendChild(desktopLink);
                return;
            }
            document.documentElement.classList.add("mobile-view");
            const link = document.createElement("link");
            link.rel = "stylesheet";
            link.href = "css/mobile.css?v=2";
            link.id = "mobileStylesheet";
            document.head.appendChild(link);
            const setViewportUnit = () => {
                const viewportHeight = window.visualViewport ? window.visualViewport.height : window.innerHeight;
                document.documentElement.style.setProperty("--mobile-vh", `${viewportHeight}px`);
            };

            const applyBodyClass = () => {
                if (document.body) {
                    document.body.classList.add("mobile-view");
                    setViewportUnit();
                }
            };
            if (document.readyState === "loading") {
                document.addEventListener("DOMContentLoaded", applyBodyClass, { once: true });
            } else {
                applyBodyClass();
            }

            window.addEventListener("resize", setViewportUnit);
            window.addEventListener("orientationchange", setViewportUnit);
            if (window.visualViewport) {
                window.visualViewport.addEventListener("resize", setViewportUnit);
                window.visualViewport.addEventListener("scroll", setViewportUnit);
            }

            setViewportUnit();
        })();
    </script>
    <style id="safari-ios-26-fix">
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            overflow-x: hidden;
            box-sizing: border-box;
        }
        .login-shell {
            position: relative;
            left: 50%;
            transform: translateX(-50%);
            margin-inline: auto;
        }
        body {
            padding-left: max(env(safe-area-inset-left), 0px);
            padding-right: max(env(safe-area-inset-right), 0px);
        }
        @supports (height: 100dvh) {
            :root {
                --mobile-vh: 100dvh;
            }
        }
    </style>
    <script>
        (function fixMobileVH(){
            document.documentElement.style.setProperty("--mobile-vh", window.innerHeight + "px");
            window.addEventListener("resize", fixMobileVH);
            window.addEventListener("orientationchange", fixMobileVH);
        })();
    </script>

</head>
<body>
    <!-- 银河粒子背景 -->
    <div class="galaxy-bg" aria-hidden="true"></div>

    <!-- 全屏专辑封面背景 -->
    <div class="album-bg" id="albumBg" aria-hidden="true">
        <div class="album-bg__image" id="albumBgImage"></div>
        <div class="album-bg__overlay"></div>
        <div class="album-bg__vignette"></div>
    </div>

    <!-- 背景渐变层（保留原有调色板功能） -->
    <div class="background-stage" id="backgroundStage" aria-hidden="true">
        <div class="background-stage__layer background-stage__layer--base" id="backgroundBaseLayer"></div>
        <div class="background-stage__layer background-stage__layer--transition" id="backgroundTransitionLayer"></div>
    </div>

    <!-- 桌面端：左上角搜索区域 -->
    <div class="desktop-search" id="desktopSearch">
        <div class="desktop-search__bar">
            <button class="desktop-search__icon-btn" id="desktopSearchToggle" type="button" aria-label="搜索">
                <i class="fas fa-search" aria-hidden="true"></i>
            </button>
            <input type="text" id="desktopSearchInput" class="desktop-search__input" placeholder="搜索歌曲、歌手或专辑…" autocomplete="off" aria-label="搜索输入框">
            <div class="desktop-search__source" id="sourceSelectWrapper">
                <button id="sourceSelectButton" class="source-select-btn" type="button" aria-haspopup="listbox" aria-expanded="false">
                    <span id="sourceSelectLabel">网易云</span>
                    <i class="fas fa-chevron-down caret-icon" aria-hidden="true"></i>
                </button>
                <div id="sourceMenu" class="source-menu" role="listbox" aria-labelledby="sourceSelectButton"></div>
            </div>
            <button id="desktopSearchBtn" class="desktop-search__submit" type="button" aria-label="执行搜索">
                <span>搜索</span>
            </button>
        </div>
        <!-- 搜索结果下拉 -->
        <div class="desktop-search__dropdown" id="desktopSearchDropdown" hidden>
            <div class="desktop-search__toolbar">
                <div class="import-dropdown">
                    <button class="import-selected-btn" id="importSelectedBtn" disabled>
                        <i class="fas fa-file-import"></i>
                        <span>导入已选</span>
                        <span id="importSelectedCount" class="import-selected-count"></span>
                        <i class="fas fa-chevron-down import-dropdown-caret"></i>
                    </button>
                    <div class="import-dropdown-menu" id="importSelectedMenu" hidden>
                        <button class="import-dropdown-item" id="importToPlaylist" data-action="playlist">导入到播放列表</button>
                        <button class="import-dropdown-item" id="importToFavorites" data-action="favorites">导入到收藏列表</button>
                    </div>
                </div>
            </div>
            <div class="desktop-search__results" id="desktopSearchResultsList"></div>
            <div class="desktop-search__pagination">
                <button class="load-more-btn" id="desktopLoadMoreBtn" hidden>
                    <i class="fas fa-chevron-down"></i>
                    <span>加载更多</span>
                </button>
            </div>
        </div>
    </div>

    <!-- 桌面端：右上角设置按钮 -->
    <div class="desktop-header-actions">
        <button id="toggleSidePanelBtn" class="theme-toggle-button" type="button" aria-label="播放列表" title="播放列表">
            <i class="fas fa-list" aria-hidden="true"></i>
        </button>
        <button id="themeToggleButton" class="theme-toggle-button" type="button" aria-label="切换深浅色模式">
            <i class="fas fa-sun theme-icon theme-icon--sun" aria-hidden="true"></i>
            <i class="fas fa-moon theme-icon theme-icon--moon" aria-hidden="true"></i>
        </button>
        <button id="openSettingsBtn" class="theme-toggle-button" type="button" aria-label="设置" title="设置">
            <i class="fas fa-cog" aria-hidden="true"></i>
        </button>
        <button id="loadOnlineBtn" class="desktop-radar-btn" title="聚合所有雷达，探索新音乐">
            <i class="fas fa-satellite-dish"></i>
            <span class="btn-text">探索雷达</span>
            <span class="loader" style="display: none;"></span>
        </button>
    </div>

    <!-- 中央歌词区域 -->
    <div class="lyrics-stage" id="lyricsStage">
        <div class="lyrics-stage__song-info">
            <div class="lyrics-stage__title" id="currentSongTitle">选择一首歌曲开始播放</div>
            <div class="lyrics-stage__artist" id="currentSongArtist">
                <span>未知艺术家</span>
                <button
                    class="favorite-toggle current-favorite-btn"
                    id="currentFavoriteToggle"
                    type="button"
                    aria-label="收藏当前歌曲"
                    title="收藏当前歌曲"
                >
                    <i class="far fa-heart" aria-hidden="true"></i>
                </button>
            </div>
        </div>
        <div class="lyrics-stage__viewport" id="lyricsViewport">
            <div class="lyrics-stage__content" id="lyricsContent">
            </div>
        </div>
    </div>

    <!-- 桌面端：右侧扇形播放列表（悬停出现） -->
    <div class="side-panel-trigger" id="sidePanelTrigger" aria-hidden="true"></div>
    <aside class="side-panel" id="sidePanel" aria-label="播放列表与收藏夹">
        <div class="side-panel__header">
            <div class="side-panel__tabs" role="tablist">
                <button
                    id="sidePlaylistTab"
                    class="side-panel__tab active"
                    type="button"
                    role="tab"
                    aria-selected="true"
                    data-target="playlist"
                >
                    <i class="fas fa-list" aria-hidden="true"></i>
                    <span>播放列表</span>
                </button>
                <button
                    id="sideFavoritesTab"
                    class="side-panel__tab"
                    type="button"
                    role="tab"
                    aria-selected="false"
                    data-target="favorites"
                >
                    <i class="fas fa-heart" aria-hidden="true"></i>
                    <span>收藏夹</span>
                </button>
            </div>
            <div class="side-panel__actions" id="sidePanelActions">
                <!-- 播放列表操作 -->
                <div class="side-actions-group" id="sidePlaylistActions" role="group" aria-label="播放列表操作">
                    <input id="importPlaylistInput" class="playlist-import-input" type="file" accept="application/json" hidden />
                    <button class="side-action-btn" id="importPlaylistBtn" type="button" title="导入播放列表" aria-label="导入播放列表">
                        <i class="fas fa-file-import" aria-hidden="true"></i>
                    </button>
                    <button class="side-action-btn" id="exportPlaylistBtn" type="button" title="导出播放列表" aria-label="导出播放列表">
                        <i class="fas fa-file-export" aria-hidden="true"></i>
                    </button>
                    <button class="side-action-btn side-action-btn--clear" id="clearPlaylistBtn" type="button" onclick="clearPlaylist()" title="清空播放列表" aria-label="清空播放列表">
                        <i class="fas fa-trash" aria-hidden="true"></i>
                    </button>
                </div>
                <!-- 收藏夹操作 -->
                <div class="side-actions-group" id="sideFavoritesActions" role="group" aria-label="收藏列表操作" hidden>
                    <button class="side-action-btn" id="addAllFavoritesBtn" type="button" title="全部添加到播放列表" aria-label="全部添加到播放列表">
                        <i class="fas fa-plus-circle" aria-hidden="true"></i>
                    </button>
                    <input id="importFavoritesInput" class="playlist-import-input" type="file" accept="application/json" hidden />
                    <button class="side-action-btn" id="importFavoritesBtn" type="button" title="导入收藏列表" aria-label="导入收藏列表">
                        <i class="fas fa-file-import" aria-hidden="true"></i>
                    </button>
                    <button class="side-action-btn" id="exportFavoritesBtn" type="button" title="导出收藏列表" aria-label="导出收藏列表">
                        <i class="fas fa-file-export" aria-hidden="true"></i>
                    </button>
                    <button class="side-action-btn side-action-btn--clear" id="clearFavoritesBtn" type="button" title="清空收藏列表" aria-label="清空收藏列表">
                        <i class="fas fa-trash" aria-hidden="true"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- 扇形播放列表 -->
        <div class="fan-container" id="fanContainer">
            <div class="fan-scroll" id="fanScroll">
                <div class="fan-track" id="playlistFanTrack">
                    <!-- 播放列表扇形项由JS生成 -->
                    <div class="fan-list" id="fanPlaylistItems"></div>
                </div>
                <div class="fan-track" id="favoritesFanTrack" hidden>
                    <div class="fan-list" id="fanFavoriteItems"></div>
                </div>
            </div>
        </div>
    </aside>

    <!-- 移动端顶部工具栏 -->
    <div class="mobile-toolbar" id="mobileToolbar" role="toolbar">
        <button class="mobile-toolbar__button" id="mobileExploreButton" type="button" aria-label="探索雷达">
            <i class="fas fa-satellite-dish" aria-hidden="true"></i>
        </button>
        <div class="mobile-toolbar__title" id="mobileToolbarTitle">Solara</div>
        <div class="mobile-toolbar__actions">
            <button class="mobile-toolbar__button" id="mobileQueueTopBtn" type="button" aria-label="播放列表" title="播放列表">
                <i class="fas fa-bars" aria-hidden="true"></i>
            </button>
            <button class="mobile-toolbar__button" id="mobileSearchToggle" type="button" aria-label="打开搜索">
                <i class="fas fa-search" aria-hidden="true"></i>
            </button>
        </div>
    </div>

    <!-- 移动端：悬浮封面+歌词 -->
    <div class="mobile-stage" id="mobileStage">
        <div class="mobile-stage__cover-wrap" id="mobileCoverWrap">
            <div class="mobile-stage__cover" id="albumCover">
                <div class="placeholder">
                    <i class="fas fa-music"></i>
                </div>
            </div>
        </div>
        <div class="mobile-stage__lyrics-float" id="mobileLyricsFloat">
            <div class="mobile-stage__lyrics-content" id="mobileInlineLyricsContent"></div>
        </div>
        <div class="mobile-stage__song-info">
            <div class="mobile-stage__title-row">
                <span class="mobile-stage__title" id="mobileSongTitle">选择一首歌曲开始播放</span>
                <button class="favorite-toggle current-favorite-btn" id="mobileFavoriteToggle" type="button" aria-label="收藏当前歌曲">
                    <i class="far fa-heart" aria-hidden="true"></i>
                </button>
            </div>
            <div class="mobile-stage__artist" id="mobileSongArtist">未知艺术家</div>
        </div>
        <button class="mobile-quality-chip" id="mobileQualityToggle" type="button" aria-haspopup="menu" aria-expanded="false">
            <span id="mobileQualityLabel">极高音质</span>
            <i class="fas fa-chevron-up" aria-hidden="true"></i>
        </button>
    </div>

    <!-- 底部播放器控制栏（参考网易云风格） -->
    <div class="player-bar" id="playerBar" role="region" aria-label="播放控制">
        <!-- 左：当前歌曲缩略信息 -->
        <div class="player-bar__left">
            <div class="player-bar__cover" id="playerBarCover">
                <div class="player-bar__cover-inner">
                    <i class="fas fa-music player-bar__cover-icon"></i>
                </div>
            </div>
            <div class="player-bar__info">
                <div class="player-bar__song-title" id="playerBarTitle">未播放</div>
                <div class="player-bar__song-artist" id="playerBarArtist">—</div>
            </div>
        </div>

        <!-- 中：播放控制 + 进度 -->
        <div class="player-bar__center">
            <div class="player-bar__transport">
                <button class="transport-btn transport-btn--mode" id="playModeBtn" type="button" title="播放模式" aria-label="播放模式">
                    <i class="fas fa-repeat" aria-hidden="true"></i>
                </button>
                <button class="transport-btn transport-btn--prev" onclick="playPrevious()" type="button" title="上一曲" aria-label="上一曲">
                    <i class="fas fa-backward-step" aria-hidden="true"></i>
                </button>
                <button class="transport-btn transport-btn--play" id="playPauseBtn" type="button" title="播放 / 暂停" aria-label="播放或暂停">
                    <i class="fas fa-play" aria-hidden="true"></i>
                </button>
                <button class="transport-btn transport-btn--next" onclick="playNext()" type="button" title="下一曲" aria-label="下一曲">
                    <i class="fas fa-forward-step" aria-hidden="true"></i>
                </button>
                <button class="transport-btn transport-btn--shuffle" id="shuffleToggleBtn" type="button" title="随机播放" aria-label="切换随机播放">
                    <i class="fas fa-shuffle shuffle-icon shuffle-icon--off" aria-hidden="true"></i>
                </button>
            </div>
            <div class="player-bar__progress">
                <span class="player-bar__time" id="currentTimeDisplay">00:00</span>
                <input type="range" id="progressBar" class="player-bar__slider" min="0" max="0" step="0.1" value="0" aria-label="播放进度">
                <span class="player-bar__time" id="durationDisplay">00:00</span>
            </div>
        </div>

        <!-- 右：收藏 + 音质 + 音量 + 队列 -->
        <div class="player-bar__right">
            <button class="transport-btn transport-btn--fav" id="playerBarFavBtn" type="button" title="收藏当前歌曲" aria-label="收藏当前歌曲">
                <i class="far fa-heart" aria-hidden="true"></i>
            </button>
            <div class="player-bar__quality">
                <button id="qualityToggle" class="quality-btn" type="button" aria-haspopup="true" aria-expanded="false">
                    <span id="qualityLabel">极高音质</span>
                    <i class="fas fa-chevron-up quality-btn__caret" aria-hidden="true"></i>
                </button>
                <div id="playerQualityMenu" class="player-quality-menu"></div>
            </div>
            <div class="player-bar__volume">
                <button class="volume-btn" id="volumeIconBtn" type="button" aria-label="音量控制" aria-expanded="false">
                    <i id="volumeIcon" class="fas fa-volume-up" aria-hidden="true"></i>
                </button>
                <div class="volume-popover" id="volumePopover" hidden>
                    <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.01" value="0.8" aria-label="音量滑块">
                </div>
            </div>
            <button class="transport-btn transport-btn--queue" id="mobileQueueToggle" type="button" title="播放列表" aria-label="打开播放列表">
                <i class="fas fa-bars" aria-hidden="true"></i>
            </button>
        </div>
    </div>

    <!-- 移动端：搜索遮罩 -->
    <div class="mobile-overlay-scrim" id="mobileOverlayScrim"></div>
    <div class="mobile-search-mask" id="mobileSearchMask">
        <div class="mobile-search-panel">
            <div class="mobile-search-header">
                <h2 class="mobile-search-title">探索音乐</h2>
                <button type="button" class="mobile-close-btn" id="mobileSearchClose" aria-label="关闭搜索">
                    <i class="fas fa-times" aria-hidden="true"></i>
                </button>
            </div>
            <div class="mobile-search-controls">
                <div class="mobile-search-bar">
                    <i class="fas fa-search mobile-search-icon" aria-hidden="true"></i>
                    <input type="text" id="searchInput" class="mobile-search-input" placeholder="搜索歌曲、歌手或专辑…" autocomplete="off" aria-label="搜索输入框">
                    <button id="mobileSearchSubmit" class="mobile-search-submit" type="button" aria-label="执行搜索">搜索</button>
                </div>
                <div class="mobile-search-source">
                    <button id="mobileSourceSelectBtn" class="source-select-btn" type="button" aria-haspopup="listbox" aria-expanded="false">
                        <span id="mobileSourceSelectLabel">网易云</span>
                        <i class="fas fa-chevron-down caret-icon" aria-hidden="true"></i>
                    </button>
                </div>
            </div>
            <div class="mobile-search-toolbar">
                <div class="import-dropdown">
                    <button class="import-selected-btn" id="mobileImportSelectedBtn" disabled>
                        <i class="fas fa-file-import"></i>
                        <span>导入已选</span>
                        <span id="mobileImportSelectedCount" class="import-selected-count"></span>
                        <i class="fas fa-chevron-down import-dropdown-caret"></i>
                    </button>
                </div>
            </div>
            <div class="mobile-search-results" id="mobileSearchResultsList"></div>
            <div class="mobile-search-pagination">
                <button class="load-more-btn" id="mobileLoadMoreBtn" hidden>
                    <i class="fas fa-chevron-down"></i>
                    <span>加载更多</span>
                </button>
            </div>
        </div>
    </div>

    <!-- 移动端：底部抽屉式播放列表 -->
    <div class="mobile-panel" id="mobilePanel">
        <div class="mobile-panel-header" id="mobilePanelHeader">
            <div class="mobile-panel-handle" aria-hidden="true"></div>
            <div class="playlist-tabs" role="tablist">
                <button
                    id="mobilePlaylistTab"
                    class="playlist-tab active"
                    type="button"
                    role="tab"
                    aria-selected="true"
                    data-target="playlist"
                >播放列表</button>
                <button
                    id="mobileFavoritesTab"
                    class="playlist-tab"
                    type="button"
                    role="tab"
                    aria-selected="false"
                    data-target="favorites"
                >收藏列表</button>
            </div>
            <div class="mobile-panel-actions">
                <div class="mobile-actions-group" id="mobilePlaylistActions" role="group" aria-label="播放列表操作">
                    <button id="mobileImportPlaylistBtn" class="mobile-panel-action-btn" type="button" aria-label="导入播放列表" title="导入播放列表">
                        <i class="fas fa-file-import" aria-hidden="true"></i>
                    </button>
                    <button id="mobileExportPlaylistBtn" class="mobile-panel-action-btn" type="button" aria-label="导出播放列表" title="导出播放列表" aria-disabled="true" disabled>
                        <i class="fas fa-file-export" aria-hidden="true"></i>
                    </button>
                    <button id="mobileClearPlaylistBtn" class="mobile-panel-action-btn mobile-panel-clear-btn" type="button" aria-label="清空播放列表" title="清空播放列表" onclick="clearPlaylist()" hidden>
                        <i class="fas fa-trash" aria-hidden="true"></i>
                    </button>
                </div>
                <div class="mobile-actions-group" id="mobileFavoritesActions" role="group" aria-label="收藏列表操作" hidden>
                    <button id="mobileAddAllFavoritesBtn" class="mobile-panel-action-btn" type="button" aria-label="全部添加到播放列表" title="全部添加到播放列表">
                        <i class="fas fa-plus-circle" aria-hidden="true"></i>
                    </button>
                    <button id="mobileImportFavoritesBtn" class="mobile-panel-action-btn" type="button" aria-label="导入收藏列表" title="导入收藏列表">
                        <i class="fas fa-file-import" aria-hidden="true"></i>
                    </button>
                    <button id="mobileExportFavoritesBtn" class="mobile-panel-action-btn" type="button" aria-label="导出收藏列表" title="导出收藏列表" aria-disabled="true" disabled>
                        <i class="fas fa-file-export" aria-hidden="true"></i>
                    </button>
                    <button id="mobileClearFavoritesBtn" class="mobile-panel-action-btn mobile-panel-clear-btn" type="button" aria-label="清空收藏列表" title="清空收藏列表">
                        <i class="fas fa-trash" aria-hidden="true"></i>
                    </button>
                </div>
                <button id="mobilePanelClose" class="mobile-close-btn mobile-panel-action-btn" type="button" aria-label="收起播放面板">
                    <i class="fas fa-chevron-down" aria-hidden="true"></i>
                </button>
            </div>
        </div>
        <div class="playlist active empty" id="playlist" role="tabpanel" aria-labelledby="playlistTab">
            <div class="playlist-scroll">
                <div class="playlist-items" id="playlistItems"></div>
            </div>
        </div>
        <div class="playlist favorites empty" id="favorites" role="tabpanel" aria-labelledby="favoritesTab" hidden>
            <div class="playlist-scroll">
                <div class="playlist-items" id="favoriteItems"></div>
            </div>
        </div>
    </div>

    <audio id="audioPlayer" preload="metadata" playsinline></audio>

    <!-- 设置模态框 -->
    <div id="settingsModal" class="modal-overlay" aria-hidden="true">
        <div class="modal-content settings-content">
            <div class="modal-header">
                <h2>设置</h2>
                <button id="closeSettingsBtn" class="close-modal-btn" aria-label="关闭设置">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <section class="settings-section">
                    <h3>探索雷达风格</h3>
                    <p class="settings-hint">选择您喜欢的音乐风格，探索雷达将从中为您推荐歌曲。</p>
                    <div id="radarGenreList" class="genre-grid"></div>
                </section>
            </div>
            <div class="modal-footer">
                <button id="saveSettingsBtn" class="save-settings-btn">保存设置</button>
            </div>
        </div>
    </div>

    <!-- 通知容器 -->
    <div id="notification" class="notification" role="status" aria-live="polite"></div>

    <!-- 调试信息容器 -->
    <div id="debugInfo" class="debug-info"></div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/index.js"></script>
    <script>
        if (window.__SOLARA_IS_MOBILE) {
            const mobileScript = document.createElement('script');
            mobileScript.src = 'js/mobile.js';
            mobileScript.async = false;
            mobileScript.defer = false;
            document.body.appendChild(mobileScript);
        }
    </script>
</body>
</html>
